[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -v --strict-markers -p asyncio
asyncio_mode = auto
markers =
    sil: Home Assistant SIL tests (Linux/WSL2 only; skipped on native Windows unless BLHAOS_RUN_SIL=1)
# An un-awaited coroutine is a dropped state update, so fail the suite on it
# instead of only printing a warning. Only the bare category filter works: the
# warning arrives through pytest's unraisable-exception hook (see the bridge
# pytest.ini note) and pytest>=9 removed --unraisableexception=raise.
filterwarnings =
    error::RuntimeWarning
